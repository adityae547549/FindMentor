<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | FindMentor</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fbcfe8, #f9a8d4);
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
        }
        .card {
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,.15);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #db2777; font-size: 4rem; margin: 0; line-height: 1; }
        h2 { color: #333; margin: 10px 0 20px; }
        p { color: #666; margin-bottom: 30px; }
        .btn {
            display: inline-block;
            background: #db2777;
            color: #fff;
            padding: 12px 30px;
            border-radius: 99px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="card">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>Oops! The page you are looking for might have been removed or is temporarily unavailable.</p>
        <a href="index.html" class="btn">Go Home</a>
    </div>
</body>
</html>
