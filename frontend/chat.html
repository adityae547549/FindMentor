<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Chat | FindMentor</title>
<link rel="icon" type="image/png" href="/frontend/assets/logo.png">
<style>
body{font-family:Inter,sans-serif;background:#f9fafb;margin:0;height:100vh;display:flex;flex-direction:column}
.chat{
  flex:1;
  display:flex;
  flex-direction:column;
  max-width:800px;
  width:100%;
  margin:0 auto;
  background:#fff;
  box-shadow:0 0 10px rgba(0,0,0,0.05);
}
#messages{
  flex:1;
  overflow-y:auto;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.msg{padding:10px 14px;border-radius:12px;max-width:80%;word-wrap:break-word}
.me{background:#e0e7ff;align-self:flex-end;border-bottom-right-radius:2px}
.other{background:#f1f5f9;align-self:flex-start;border-bottom-left-radius:2px}
.input-area{
  padding:16px;
  border-top:1px solid #eee;
  background:#fff;
}
input{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:24px;
  outline:none;
  font-size:16px; /* Prevents zoom on iOS */
}
input:focus{border-color:#4f46e5}
</style>
</head>
<body>

<div class="chat">
  <div id="messages"></div>
  <div class="input-area">
    <input id="text" placeholder="Type a message…" />
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  getFirestore, collection, addDoc,
  query, orderBy, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD6gXvi6bmPd5GCKQ-1kZ66YPCb-A34tqo",
  authDomain: "studio-6680101022-359df.firebaseapp.com",
  projectId: "studio-6680101022-359df",
  storageBucket: "studio-6680101022-359df.firebasestorage.app",
  messagingSenderId: "938584797960",
  appId: "1:938584797960:web:e57f885a6be9bb4deab2bd"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const requestId = new URLSearchParams(location.search).get("id");
const messagesDiv = document.getElementById("messages");
const textInput = document.getElementById("text");

onAuthStateChanged(auth, user => {
  if (!user) {
    location.href = "/login";
    return;
  }

  if (!requestId) {
    messagesDiv.innerHTML = "<div class=\"msg other\">No chat selected.</div>";
    return;
  }

  const q = query(
    collection(db,"chats",requestId,"messages"),
    orderBy("createdAt")
  );

  onSnapshot(q, snap => {
    messagesDiv.innerHTML = "";
    snap.forEach(d=>{
      const m=d.data();
      messagesDiv.innerHTML += `
        <div class="msg ${m.senderId===user.uid?"me":"other"}">
          ${m.text}
        </div>
      `;
    });
  });

  textInput.addEventListener("keydown", async e=>{
    if(e.key==="Enter" && textInput.value.trim()){
      await addDoc(collection(db,"chats",requestId,"messages"),{
        senderId:user.uid,
        text:textInput.value,
        createdAt:serverTimestamp()
      });
      textInput.value="";
    }
  });
});
</script>
</body>
</html>
