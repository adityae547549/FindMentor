<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Study Assistant | FindMentor</title>
  <link rel="icon" type="image/png" href="/frontend/assets/logo.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.3/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
    @import url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css');

    :root {
      --bg-main: #0f172a; /* Deep blue-gray */
      --bg-sidebar: #1e293b; /* Slate 800 */
      --bg-input: #334155; /* Slate 700 */
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #10b981; /* Emerald 500 */
      --accent-hover: #059669;
      --accent-soft: rgba(16, 185, 129, 0.1);
      --user-msg-bg: #4f46e5; /* Indigo 600 */
      --border: rgba(255, 255, 255, 0.1);
      --glass: rgba(255, 255, 255, 0.05);
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --shadow-glow: 0 0 20px rgba(16, 185, 129, 0.3);
    }

    * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* SCROLLBAR */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

    /* SIDEBAR */
    .sidebar {
      width: 280px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px;
      z-index: 100;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar-header {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .user-profile {
      margin-top: auto;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-name {
      font-size: 0.9rem;
      font-weight: 500;
    }

    .new-chat-btn {
      background: linear-gradient(135deg, var(--accent), #059669);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      margin-bottom: 30px;
      box-shadow: var(--shadow-md);
      transition: all 0.2s;
      font-size: 0.95rem;
    }

    .new-chat-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-glow);
    }

    .history-item {
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
      transition: all 0.2s;
      border: 1px solid transparent;
    }

    .history-item:hover {
      background: var(--glass);
      color: var(--text-main);
    }
    
    .history-item.active {
      background: var(--glass);
      color: var(--accent);
      border-color: var(--accent-soft);
      font-weight: 500;
    }

    /* MAIN CONTENT */
    .main-content {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100%;
      background: radial-gradient(circle at top right, #1e293b 0%, var(--bg-main) 40%);
    }

    /* HAMBURGER BUTTON */
    .hamburger-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 60;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      display: none;
      backdrop-filter: blur(5px);
      box-shadow: var(--shadow-md);
      transition: all 0.2s;
    }
    
    .hamburger-btn:hover { background: #334155; color: white; }

    /* CHAT CONTAINER */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 0 140px 0; /* Bottom padding for input area */
      scroll-behavior: smooth;
    }

    /* WELCOME SCREEN */
    .welcome-container {
      max-width: 900px;
      margin: 40px auto;
      text-align: center;
      padding: 40px 20px;
      animation: fadeIn 0.6s ease-out;
    }

    .welcome-title {
      font-weight: 600;
      font-size: 2.2rem;
      margin: 0;
    }

    .welcome-subtitle {
      color: var(--text-muted);
      margin-top: 10px;
      font-size: 1.1rem;
    }

    .welcome-logo {
      font-size: 4rem;
      margin-bottom: 20px;
      background: linear-gradient(135deg, var(--accent), #3b82f6);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 30px rgba(16, 185, 129, 0.2));
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 50px;
    }

    .card-item {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--border);
      padding: 30px;
      border-radius: 20px;
      cursor: pointer;
      text-align: left;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }
    
    .card-item::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(135deg, rgba(255,255,255,0.05), transparent);
        opacity: 0;
        transition: opacity 0.3s;
    }

    .card-item:hover {
      border-color: var(--accent);
      background: rgba(30, 41, 59, 0.9);
      transform: translateY(-8px);
      box-shadow: 0 20px 40px -10px rgba(0,0,0,0.3);
    }
    
    .card-item:hover::before { opacity: 1; }
    
    .card-item i {
      font-size: 2rem;
      margin-bottom: 20px;
      padding: 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      width: fit-content;
    }

    /* MESSAGES */
    .message {
      padding: 20px 10%;
      width: 100%;
      display: flex;
      animation: slideUp 0.3s ease-out;
    }
    
    @media (min-width: 1600px) {
        .message { padding: 20px 20%; }
    }

    .message.user { justify-content: flex-end; }
    
    .message-content {
      display: flex;
      gap: 16px;
      max-width: 85%;
      align-items: flex-start;
    }
    
    .message.user .message-content { flex-direction: row-reverse; }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      font-size: 1rem;
      box-shadow: var(--shadow-md);
      transition: transform 0.2s;
    }
    
    .avatar:hover { transform: scale(1.1); }

    .message.ai .avatar { 
        background: linear-gradient(135deg, var(--accent), #059669); 
        color: white; 
        border-radius: 50% 50% 50% 6px;
    }
    
    .message.user .avatar { 
        background: linear-gradient(135deg, #6366f1, #4338ca); 
        color: white; 
        border-radius: 50% 50% 6px 50%;
    }

    .text {
      padding: 16px 24px;
      border-radius: 20px;
      line-height: 1.7;
      font-size: 1rem;
      position: relative;
      box-shadow: var(--shadow-sm);
      word-wrap: break-word;
    }

    .message.ai .text {
      background: #1e293b;
      color: var(--text-main);
      border-top-left-radius: 4px;
      border: 1px solid var(--border);
    }

    .message.user .text {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      border-top-right-radius: 4px;
    }

    /* CODE BLOCKS */
    .text pre { 
        background: #0f172a !important; 
        padding: 16px; 
        border-radius: 12px; 
        overflow-x: auto;
        margin: 16px 0;
        border: 1px solid var(--border);
        font-size: 0.9rem;
    }

    .text code {
        font-family: 'JetBrains Mono', 'Consolas', monospace;
        background: rgba(0,0,0,0.3);
        padding: 3px 6px;
        border-radius: 4px;
        color: #e2e8f0;
    }

    /* INPUT AREA */
    .input-container {
      position: absolute;
      bottom: 0;
      width: 100%;
      padding: 20px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, var(--bg-main) 30%, transparent);
      z-index: 50;
    }

    .input-box-wrapper {
      max-width: 850px;
      margin: 0 auto;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 28px;
      padding: 12px 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      backdrop-filter: blur(20px);
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
    }
    
    .input-box-wrapper:focus-within {
        border-color: var(--accent);
        box-shadow: 0 20px 40px rgba(16, 185, 129, 0.15);
        background: rgba(30, 41, 59, 0.95);
    }
    
    .input-controls {
        display: flex;
        align-items: flex-end;
        gap: 12px;
        width: 100%;
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      resize: none;
      padding: 14px 0;
      font-size: 1.05rem;
      font-family: inherit;
      line-height: 1.5;
      max-height: 200px;
    }

    .action-btn {
      color: var(--text-muted);
      padding: 10px;
      border-radius: 50%;
      transition: all 0.2s;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
    }

    .action-btn:hover {
      background: rgba(255,255,255,0.1);
      color: white;
    }
    
    .send-btn {
        background: var(--accent);
        color: white;
        margin-left: 6px;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }
    
    .send-btn:hover {
        background: var(--accent-hover);
        transform: scale(1.05);
    }
    
    .preview-area {
        margin-bottom: 8px;
        animation: fadeIn 0.3s;
    }

    /* MOBILE RESPONSIVE */
    @media (max-width: 768px) {
      .sidebar { 
          position: fixed; 
          left: -280px; 
          height: 100%; 
          box-shadow: 5px 0 25px rgba(0,0,0,0.5); 
      }
      .sidebar.open { left: 0; }
      
      .message { padding: 15px 4%; }
      .message-content { max-width: 95%; gap: 10px; }
      
      .text { 
          font-size: 0.95rem; 
          padding: 12px 16px; 
          border-radius: 16px;
      }
      
      .welcome-logo { font-size: 3rem; }
      .hamburger-btn { display: block; }
      .chat-container { padding-top: 60px; }
      
      .input-container { padding: 15px 10px; }
      .input-box-wrapper { border-radius: 20px; padding: 10px 16px; }
    }
    
    /* MODAL STYLES */
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(8px);
        display: none;
        align-items: center; justify-content: center;
        z-index: 1000;
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .modal-overlay[style*="display: flex"] { opacity: 1; }

    .modal-box {
        background: #1e293b;
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 30px;
        width: 90%;
        max-width: 400px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        transform: scale(0.9);
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay[style*="display: flex"] .modal-box { transform: scale(1); }

    .modal-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 12px; color: white; }
    .modal-msg { color: var(--text-muted); margin-bottom: 30px; line-height: 1.6; }

    .modal-actions { display: flex; justify-content: flex-end; gap: 12px; }

    .btn-modal {
        padding: 12px 24px;
        border-radius: 12px;
        border: none;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s;
        font-size: 0.95rem;
    }

    .btn-cancel { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
    .btn-cancel:hover { background: rgba(255,255,255,0.05); color: white; border-color: white; }

    .btn-confirm { background: #ef4444; color: white; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }
    .btn-confirm:hover { background: #dc2626; transform: translateY(-2px); }
    
    /* TOAST STYLES */
    .toast-container {
        position: fixed; top: 20px; right: 20px; z-index: 2000;
        display: flex; flex-direction: column; gap: 12px;
    }

    .toast {
        background: #1e293b;
        border: 1px solid var(--border);
        padding: 16px 24px;
        border-radius: 16px;
        display: flex; align-items: center; gap: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        color: white;
        font-weight: 500;
    }

    .toast.success i { color: #10b981; }
    .toast.error i { color: #ef4444; }
    .toast.info i { color: #3b82f6; }

    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    
    /* TYPING INDICATOR */
    .typing-indicator { display: flex; gap: 6px; padding: 10px; }
    .typing-dot {
      width: 8px; height: 8px;
      background: #94a3b8;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
  </style>
</head>
<body>
  
  <div class="sidebar" id="sidebar">
    <button class="new-chat-btn" onclick="window.location.href='/dashboard'" style="background: transparent; border: 1px solid var(--border); margin-bottom: 10px;">
      <i class="fas fa-arrow-left"></i> Back to Dashboard
    </button>
    <button class="new-chat-btn" onclick="startNewChat()">
      <i class="fas fa-plus-circle"></i> New Session

    <div style="font-size:0.7rem; color:var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; font-weight: 600;">Recent Sessions</div>

    <div style="margin-top:auto; padding-top:20px; border-top:1px solid var(--border); display:flex; align-items:center; gap:12px;">

            <p class="welcome-subtitle">Your personal study companion.</p>
            
            <div class="cards-grid">

                    <p class="card-desc">Summarize complex academic papers.</p>
                </div>
                <div class="card-item" onclick="prepareInput('YouTube')">

            </div>
        </div>
      </div>

      <div class="input-container">
        <div class="input-box-wrapper">
          <div class="preview-area" id="preview-area" style="display:none;">
            <div class="file-badge">
                <span id="file-name"></span> <i class="fas fa-times" onclick="clearFile()" style="cursor:pointer"></i>
            </div>
          </div>
          <div class="input-controls">
              <i class="fas fa-paperclip action-btn" onclick="document.getElementById('file-input').click()"></i>
              <textarea id="user-input" rows="1" placeholder="Type your question here..."></textarea>
              <i class="fas fa-paper-plane action-btn send-btn" id="send-btn" onclick="handleSend()"></i>
          </div>
        </div>
        <p style="text-align:center; font-size:0.7rem; color:var(--text-muted); margin-top:15px;">Built for students.</p>
      </div>
  </div>

  <input type="file" id="file-input" hidden>

  <!-- CONFIRMATION MODAL -->
  <div class="modal-overlay" id="confirm-modal">
      <div class="modal-box">
          <div class="modal-title" id="modal-title">Confirm Action</div>
          <div class="modal-msg" id="modal-msg">Are you sure?</div>
          <div class="modal-actions">
              <button class="btn-modal btn-cancel" onclick="closeModal()">Cancel</button>
              <button class="btn-modal btn-confirm" id="modal-confirm-btn">Delete</button>
          </div>
      </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div class="toast-container" id="toast-container"></div>

    // API Helper
    async function fetchAPI(endpoint, body, isFormData = false) {
      const headers = {};
      if (!isFormData) {
        headers['Content-Type'] = 'application/json';
      }
      
      const options = {
        method: 'POST',
        headers: headers,
        body: isFormData ? body : JSON.stringify(body)
      };

      const baseUrl = CONFIG.API_BASE_URL;

      const res = await fetch(`${baseUrl}${endpoint}`, options);
      const contentType = res.headers.get('content-type') || '';
      if (!res.ok) {
         if (contentType.includes('application/json')) {
            const err = await res.json();
            throw new Error(err.message || err.error || "Server Error");
         }
         const text = await res.text();
         throw new Error(text.includes('<!DOCTYPE') ? "Backend API not reachable. Start the backend server." : "Server Error");
      }
      if (!contentType.includes('application/json')) {
         const text = await res.text();
         throw new Error(text.includes('<!DOCTYPE') ? "Backend API not reachable. Start the backend server." : "Invalid server response");
      }
      return await res.json();
    }

        return { plan, limit: limits[plan] || limits.free };
    }

    async function checkDailyLimit() {
        if (!currentUser) return { allowed: false, plan: 'free', limit: 18, count: 0 };
        
        try {
            const userRef = doc(db, "users", currentUser.uid);
            const userSnap = await getDoc(userRef);
            const { plan, limit } = getPlanAndLimit(userSnap.exists() ? userSnap.data() : {});
            
            const today = new Date();
            today.setHours(0,0,0,0);
            const todayTs = Timestamp.fromDate(today);
            
            const q = query(collection(db, "aiLogs"), 
                where("studentId", "==", currentUser.uid), 
                where("createdAt", ">=", todayTs)
            );
            
            const snap = await getDocs(q);
            const count = snap.size;
            
            if (limitText) {
                limitText.textContent = `${count}/${limit} requests today`;
            }
            
            return { allowed: count < limit, plan, limit, count };
        } catch (error) {
            console.error("Daily limit check failed:", error);
            if (limitText) limitText.textContent = "Limit check unavailable";
            return { allowed: true, plan: 'free', limit: 18, count: 0 };
        }

    // Main Send Handler
    window.handleSend = async () => {

      const welcome = document.getElementById('welcome-screen');
      if (welcome) welcome.remove();

      const text = userInput.value.trim();
      const fileToSend = currentFile; // Capture file before clearing

      sendBtn.style.opacity = '0.5';

      // Prepare User Message Content
      let userMsgContent = text;
      
      if (fileToSend) {
        if (fileToSend.type.startsWith('image/')) {
            // Read image for display
            try {
                const reader = new FileReader();
                const base64Url = await new Promise((resolve) => {
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(fileToSend);
                });
                userMsgContent = (text ? text + '\n\n' : '') + `![Uploaded Image](${base64Url})`;
            } catch (e) {
                console.error("Error reading image:", e);
                userMsgContent = (text ? text + '\n\n' : '') + `[Attached: ${fileToSend.name}]`;
            }
        } else {
            userMsgContent = text ? `${text}\n\n[Attached: ${fileToSend.name}]` : `[Attached: ${fileToSend.name}]`;
        }
      }

      // Add User Message
      appendMessage('user', userMsgContent);
      
      userInput.value = '';
      userInput.style.height = 'auto';
      sendBtn.classList.remove('active');
      
      clearFile(); // Clear UI immediately

      // Show Loading
      const loadingId = appendMessage('ai', 'Thinking...', false, true);

      try {
        let response;
        
        // 1. YouTube Link Check
        const ytRegex = /(https?:\/\/)?(www\.)?(youtube\.com|youtu\.?be)\/[^\s]+/;
        const ytMatch = text.match(ytRegex);

        if (!fileToSend && ytMatch) {
           const url = ytMatch[0];
           // If user typed only the URL, let backend default to summary. 
           // If user added text, send it as the question.
           const isOnlyUrl = text.trim() === url;
           const q = isOnlyUrl ? null : text;

           response = await fetchAPI('/ask/youtube', { url: url, question: q });
           await logAIUsage('youtube', { question: text, source: 'youtube' });
           showToast("Video summarized successfully", "success");
        }
        // 2. File Uploads
        else if (fileToSend) {
          const formData = new FormData();
          if (text) formData.append('question', text);

          if (fileToSend.type.startsWith('image/')) {
            formData.append('image', fileToSend);
            response = await fetchAPI('/ask/image', formData, true);
            await logAIUsage('image', { question: text || 'Image analysis', source: 'image' });
          } 
          else if (fileToSend.type === 'application/pdf') {
            formData.append('pdf', fileToSend);
            response = await fetchAPI('/ask/pdf', formData, true);
            await logAIUsage('pdf', { question: text || 'PDF analysis', source: 'pdf' });
          }
          else if (fileToSend.type.startsWith('audio/')) {
            formData.append('audio', fileToSend);
            response = await fetchAPI('/ask/audio', formData, true);
            await logAIUsage('audio', { question: text || 'Audio analysis', source: 'audio' });
          }
          else if (fileToSend.type.startsWith('video/')) {
            formData.append('video', fileToSend);
            response = await fetchAPI('/ask/video', formData, true);
            await logAIUsage('video', { question: text || 'Video analysis', source: 'video' });
          }
          else {
            throw new Error("Unsupported file type");
          }
        }
        // 3. Text Only
        else {
          // Prepare history (last 30 messages, excluding current new message)
          // Map 'ai' -> 'assistant'
          const historyPayload = currentChatHistory
              .slice(0, -1) // Exclude the message we just added
              .slice(-30)   // Limit to last 30
              .map(msg => ({
                  role: msg.role === 'ai' ? 'assistant' : 'user',
                  content: msg.context ? `Context:\n${msg.context}\n\n${msg.content}` : msg.content
              }));

          response = await fetchAPI('/ask', { 
              question: text, 
              history: historyPayload 
          });
          await logAIUsage('text', { question: text, source: 'text' });

        // Process Response

    // Save Message to History
    async function saveMessageToHistory(role, content, context = null) {
        if (!currentUser) return;
        
        let isNewChat = false;
        if (!currentChatId) {
            currentChatId = Date.now().toString();
            isNewChat = true;
        }
        
        const docRef = doc(db, "users", currentUser.uid, "ai_chats", currentChatId);
        const timestamp = Date.now();
        const msgObj = {
            role: role,
            content: content,
            timestamp: timestamp
        };
        if (context) msgObj.context = context;

        // Update local history immediately (sync for API)
        currentChatHistory.push(msgObj);

        try {
            const updatePayload = {
                updatedAt: serverTimestamp(),
                messages: arrayUnion(msgObj)
            };
            
            // If new chat and user message, set title
            if (isNewChat && role === 'user') {
                let title = content.replace(/[#*_`]/g, '').substring(0, 30); // Clean markdown chars
                if (title.length === 0) title = "New Chat";
                if (content.length > 30) title += "...";
                updatePayload.title = title;
                updatePayload.createdAt = serverTimestamp();
            }

            await setDoc(docRef, updatePayload, { merge: true });
            
            // If it was a new chat, add to sidebar
            if (isNewChat) {
                document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));
                
                // Use helper to ensure consistent UI (including delete button)
                createChatListItem(currentChatId, updatePayload.title || 'New Chat', true);
                
                // Set active class on the newly created item
                const newItem = document.getElementById(`chat-item-${currentChatId}`);
                if (newItem) newItem.classList.add('active');
            }
        } catch (e) {
            console.error("Error saving history", e);
        }
    }

    /** Cards for YouTube search links (always opens real results on YouTube). */
    function buildYoutubeSearchCardsHTML(content) {
      const re =
        /\[([^\]]+)\]\(https:\/\/www\.youtube\.com\/results\?search_query=([^)]+)\)/gi;
      const seen = new Set();
      const rows = [];
      let m;
      while ((m = re.exec(content)) !== null) {
        const enc = m[2].trim();
        const href = `https://www.youtube.com/results?search_query=${enc}`;
        if (seen.has(href)) continue;
        seen.add(href);
        const linkTitle = m[1].replace(/^Watch:\s*/i, "").trim();
        let displayLabel = linkTitle;
        try {
          const decoded = decodeURIComponent(enc.replace(/\+/g, "%20"));
          if (decoded) displayLabel = decoded;
        } catch (_) {}
        rows.push({ href, label: displayLabel || linkTitle || "YouTube search" });
      }
      if (rows.length === 0) return "";

      let html = `<div class="yt-search-grid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap:10px; margin-top:12px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.05);">`;
      rows.forEach(({ href, label }) => {
        const safeHref = escapeHtml(href);
        const safeLabel = escapeHtml(label);
        html += `<a href="${safeHref}" target="_blank" rel="noopener noreferrer" class="yt-search-card"
          style="display:block; text-decoration:none; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:12px 14px; border-left:3px solid #ff0000; transition:background 0.2s;">
          <div style="font-size:0.65rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:4px;">Search on YouTube</div>
          <div style="font-size:0.9rem; color:var(--text-main); font-weight:600; line-height:1.35;">${safeLabel}</div>
          <div style="margin-top:8px; font-size:0.75rem; color:var(--accent); font-weight:500;">Open results <i class="fas fa-external-link-alt" style="font-size:0.65rem;"></i></div>
        </a>`;
      });
      return html + `</div>`;
    }

    // Helper to Trigger Video Summary
    window.triggerVideoSummary = (url) => {
        // Prevent accidental form submits or propagation
        if (window.event) {
            window.event.preventDefault();
            window.event.stopPropagation();
        }

        const input = document.getElementById('user-input');
        input.value = url;
        input.focus();
        
        // Use timeout to ensure no race conditions with UI events
        setTimeout(() => {
            window.handleSend();
        }, 10);
    };

    // Append Message to UI
    function appendMessage(role, content, save = true, isLoading = false) {
      // Normalize role for UI (handle 'assistant' from API/History)
      if (role === 'assistant') role = 'ai';

      if (save) saveMessageToHistory(role, content);

      const id = 'msg-' + Date.now() + Math.random().toString(16).slice(2);
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.id = id;
      
      let innerHTML = '';
      if (isLoading) {
          innerHTML = `
            <div class="typing-indicator">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>`;
      } else {
          // Parse Markdown
          const rawHtml = marked.parse(content);
          const sanitizedHtml = DOMPurify.sanitize(rawHtml);
          innerHTML = sanitizedHtml;
          
          // Add Action Bar (only for AI and not loading)
          if (role === 'ai') {
              const contentSafe = encodeURIComponent(content);
              innerHTML += `
              <div class="message-actions">
                  <button class="msg-action-btn" onclick="navigator.clipboard.writeText(decodeURIComponent('${contentSafe}'))" title="Copy">
                      <i class="fas fa-copy"></i>
                  </button>
                  <button class="msg-action-btn" onclick="downloadPDF('${contentSafe}')" title="Download PDF">
                      <i class="fas fa-file-pdf"></i>
                  </button>
              </div>`;
          }
      }

      const videosHTML = !isLoading ? buildWatchVideoCardsHTML(content) : "";
      const ytSearchHTML = !isLoading ? buildYoutubeSearchCardsHTML(content) : "";

      div.innerHTML = `
        <div class="message-content">
          <div class="avatar">
            ${(role === 'ai' || role === 'assistant') ? '<i class="fas fa-robot"></i>' : '<i class="fas fa-user"></i>'}
          </div>
          <div class="text">
            ${innerHTML}
            ${videosHTML}
            ${ytSearchHTML}
          </div>
        </div>
      `;
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      
      if (!isLoading) {
          addCodeCopyButtons(id);
      }
      
      return id;
    }

    function updateMessage(id, newContent) {
      const msg = document.getElementById(id);
      if (msg) {
        const textContainer = msg.querySelector('.text');
        
        // Parse Markdown
        const rawHtml = marked.parse(newContent);
        const sanitizedHtml = DOMPurify.sanitize(rawHtml);
        
        let finalHtml = sanitizedHtml;
        
        // Re-add Action Bar
        const contentSafe = encodeURIComponent(newContent);
        finalHtml += `
          <div class="message-actions">
              <button class="msg-action-btn" onclick="navigator.clipboard.writeText(decodeURIComponent('${contentSafe}'))" title="Copy">
                  <i class="fas fa-copy"></i>
              </button>
              <button class="msg-action-btn" onclick="downloadPDF('${contentSafe}')" title="Download PDF">
                  <i class="fas fa-file-pdf"></i>
              </button>
          </div>`;

        const videosHTML = buildWatchVideoCardsHTML(newContent);
        const ytSearchHTML = buildYoutubeSearchCardsHTML(newContent);

        textContainer.innerHTML = finalHtml + videosHTML + ytSearchHTML;
        addCodeCopyButtons(id);
        
        // Scroll to bottom to ensure visibility
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    }

    // Convert API Response to Markdown
    function formatResponseToMarkdown(data) {
      let markdown = '';
      
      // Removed Source display as per user request
      // if (data.source) {
      //   markdown += `> **Source:** ${data.source}\n\n`;
      // }

      if (data.extractedText || data.transcript) {
        const text = data.extractedText || data.transcript;
        markdown += `> **Context:** ${text.substring(0, 150)}...\n\n`;
      }

      markdown += data.answer || data.message || "No answer provided.";
      return markdown;
    }
    
    // Kept for backward compatibility references if any, but implementation replaced
    function formatResponse(data) {
        return formatResponseToMarkdown(data);
    }

    // PDF Download (Global)
    window.downloadPDF = function(contentEncoded) {
      const content = decodeURIComponent(contentEncoded);
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      
      doc.setFontSize(16);
      doc.setTextColor(40, 40, 40);
      doc.text("FindMentor Study Notes", 10, 10);
      
      doc.setFontSize(11);
      const splitText = doc.splitTextToSize(content, 180);
      doc.text(splitText, 10, 20);
      
      doc.save("FindMentor-Study-Notes.pdf");
    };

    // Allow Enter key to send
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });
  </script>
</body>
