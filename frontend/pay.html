<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FindMentor Payment</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="assets/responsive.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --accent: #8b5cf6;
            --elite: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { font-size: 1.5rem; font-weight: bold; background: linear-gradient(to right, var(--primary), var(--accent)); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
        .back-link { color: var(--text-muted); text-decoration: none; display: flex; align-items: center; gap: 8px; transition: color 0.2s; }
        .back-link:hover { color: white; }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            text-align: left;
            max-width: 640px;
            margin: 0 auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        h1 { font-size: 2rem; margin-bottom: 8px; text-align: center; }
        p.subtitle { color: var(--text-muted); font-size: 1rem; margin-bottom: 24px; text-align: center; }
        .plan-name { font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; }
        .plan-price { font-size: 2rem; font-weight: 800; margin-bottom: 16px; display: flex; align-items: baseline; gap: 6px; }
        .plan-price span { font-size: 1rem; color: var(--text-muted); font-weight: 400; }
        .features { list-style: none; margin-bottom: 24px; }
        .features li { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; font-size: 0.95rem; color: #cbd5e1; }
        .features li i { margin-top: 4px; color: var(--success); }
        .status {
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            color: var(--text-muted);
            margin-bottom: 16px;
        }
        .upi-box {
            border: 1px dashed var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            display: grid;
            gap: 12px;
        }
        .upi-qr {
            width: 220px;
            height: 220px;
            object-fit: contain;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin: 0 auto;
            background: #0b1220;
        }
        .upi-fallback {
            display: none;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .upi-id {
            text-align: center;
            font-weight: 600;
            color: var(--text-main);
        }
        .upi-actions {
            display: grid;
            gap: 10px;
        }
        .input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-main);
        }
        .btn-secondary {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-main);
            cursor: pointer;
        }
        .btn-pay {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }
        .btn-pay:hover { background: #7c3aed; box-shadow: 0 6px 16px rgba(139, 92, 246, 0.4); }
        .btn-pay:disabled { opacity: 0.6; cursor: not-allowed; }
        .small { text-align: center; margin-top: 10px; font-size: 0.8rem; color: var(--text-muted); }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">FindMentor</a>
        <a href="plans.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Plans</a>
    </nav>

    <div class="container">
        <div class="card">
            <h1>Complete Your Payment</h1>
            <p class="subtitle">Secure checkout for your selected plan</p>
            <div class="plan-name" id="plan-name"></div>
            <div class="plan-price" id="plan-price"></div>
            <ul class="features" id="plan-features"></ul>
            <div class="status" id="plan-status"></div>
            <div class="upi-box">
                <img id="upi-qr" class="upi-qr" src="assets/qr-code.jpg" alt="UPI QR" onerror="this.style.display='none';document.getElementById('upi-fallback').style.display='block';">
                <div id="upi-fallback" class="upi-fallback">Add your UPI QR image at assets/qr-code.jpg</div>
                <div class="upi-id" id="upi-id"></div>
                <div class="upi-actions">
                    <a id="upi-link" class="btn-secondary" style="text-align:center;text-decoration:none;">Pay via UPI App</a>
                    <input id="upi-input" class="input" placeholder="Enter your UPI ID (e.g., 8864049869@upi)">
                </div>
            </div>
            <button class="btn-pay" id="pay-btn">Submit Payment</button>
            <div class="small">Cancel anytime</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD6gXvi6bmPd5GCKQ-1kZ66YPCb-A34tqo",
            authDomain: "studio-6680101022-359df.firebaseapp.com",
            projectId: "studio-6680101022-359df",
            storageBucket: "studio-6680101022-359df.firebasestorage.app",
            messagingSenderId: "938584797960",
            appId: "1:938584797960:web:e57f885a6be9bb4deab2bd"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const planNameEl = document.getElementById("plan-name");
        const planPriceEl = document.getElementById("plan-price");
        const planFeaturesEl = document.getElementById("plan-features");
        const planStatusEl = document.getElementById("plan-status");
        const payBtn = document.getElementById("pay-btn");
        const upiIdEl = document.getElementById("upi-id");
        const upiLinkEl = document.getElementById("upi-link");

        const PLAN_DATA = {
            plus: {
                name: "Student Plus",
                price: 249,
                features: [
                    "Full AI access (fair usage)",
                    "3-5 video calls per month",
                    "YouTube summaries + saved answers",
                    "Mentor messaging (normal priority)",
                    "Session history",
                    "Priority over free users"
                ]
            },
            pro: {
                name: "Student Pro",
                price: 599,
                features: [
                    "Everything in Student Plus",
                    "10-15 video calls per month",
                    "Higher priority in mentor queue",
                    "Faster AI responses",
                    "Interview / deep-prep AI mode"
                ]
            }
        };

        const MERCHANT_UPI_ID = "8864049869@upi";
        const UPI_NAME = "FindMentor";

        const params = new URLSearchParams(window.location.search);
        const selectedPlan = params.get("plan");

        function renderPlan(planKey) {
            const plan = PLAN_DATA[planKey];
            if (!plan) return false;
            planNameEl.textContent = plan.name;
            planPriceEl.innerHTML = `₹${plan.price} <span>/ month</span>`;
            planFeaturesEl.innerHTML = plan.features.map(f => `<li><i class="fas fa-check"></i> ${f}</li>`).join("");
            const upiLabel = MERCHANT_UPI_ID ? `UPI ID: ${MERCHANT_UPI_ID}` : "Add UPI ID";
            upiIdEl.textContent = upiLabel;
            const upiUrl = MERCHANT_UPI_ID ? `upi://pay?pa=${encodeURIComponent(MERCHANT_UPI_ID)}&pn=${encodeURIComponent(UPI_NAME)}&am=${plan.price}&cu=INR` : "";
            upiLinkEl.style.display = MERCHANT_UPI_ID ? "block" : "none";
            upiLinkEl.href = upiUrl;
            return true;
        }

        if (!renderPlan(selectedPlan)) {
            planNameEl.textContent = "Plan not found";
            planPriceEl.textContent = "";
            planFeaturesEl.innerHTML = "";
            planStatusEl.textContent = "Please select a valid plan from the pricing page.";
            payBtn.disabled = true;
            setTimeout(() => window.location.href = "plans.html", 1200);
        }

        let currentUser = null;
        let currentPlan = "free";
        const upiInput = document.getElementById("upi-input");
        let payerUpiId = "";
        upiInput?.addEventListener("input", () => {
            payerUpiId = upiInput.value.trim();
        });

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                planStatusEl.textContent = "Please log in to continue.";
                payBtn.textContent = "Login to Continue";
                payBtn.onclick = () => window.location.href = "login.html";
                return;
            }

            currentUser = user;
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (userDoc.exists()) {
                const data = userDoc.data();
                currentPlan = data.plan || (data.isPremium ? "plus" : "free");
                if (data.paymentStatus === "paid" && currentPlan === selectedPlan) {
                    planStatusEl.textContent = `Payment received. Redirecting to dashboard...`;
                    payBtn.textContent = "Current Plan";
                    payBtn.disabled = true;
                    setTimeout(() => window.location.href = "dashboard.html", 800);
                    return;
                }
                if (currentPlan === selectedPlan) {
                    planStatusEl.textContent = `You are already subscribed to ${PLAN_DATA[selectedPlan]?.name || "this plan"}.`;
                    payBtn.textContent = "Current Plan";
                    payBtn.disabled = true;
                } else {
                    planStatusEl.textContent = `Current plan: ${currentPlan === "free" ? "Free / Explorer" : PLAN_DATA[currentPlan]?.name || "Student Plus"}`;
                }
            }
        });

        payBtn.onclick = async () => {
            if (!currentUser) {
                window.location.href = "login.html";
                return;
            }
            if (!PLAN_DATA[selectedPlan]) return;
            if (currentPlan === selectedPlan) return;
            if (!payerUpiId) {
                planStatusEl.textContent = "Please enter a valid UPI ID before submitting.";
                return;
            }
            payBtn.disabled = true;
            payBtn.textContent = "Submitting...";
            try {
                await addDoc(collection(db, "paymentRequests"), {
                    userId: currentUser.uid,
                    email: currentUser.email || "",
                    plan: selectedPlan,
                    amount: PLAN_DATA[selectedPlan].price,
                    merchantUpiId: MERCHANT_UPI_ID,
                    payerUpiId: payerUpiId,
                    status: "pending",
                    createdAt: serverTimestamp()
                });
                await updateDoc(doc(db, "users", currentUser.uid), {
                    plan: selectedPlan,
                    isPremium: true,
                    paymentStatus: "pending",
                    updatedAt: new Date()
                });
                planStatusEl.textContent = `Payment initiated. Waiting for bank confirmation...`;
                payBtn.textContent = "Processing...";
                payBtn.disabled = true;
                
                const userRef = doc(db, "users", currentUser.uid);
                const checkInterval = setInterval(async () => {
                    try {
                        const snap = await getDoc(userRef);
                        if (snap.exists() && snap.data().paymentStatus === "paid") {
                            clearInterval(checkInterval);
                            planStatusEl.textContent = "Payment received. Redirecting...";
                            setTimeout(() => window.location.href = "dashboard.html", 800);
                        }
                    } catch {}
                }, 2000);
            } catch (e) {
                console.error("Payment submit failed:", e);
                planStatusEl.textContent = e.message || "Payment failed. Please try again.";
                payBtn.disabled = false;
                payBtn.textContent = "Submit Payment";
            }
        };
    </script>
</body>
</html>
